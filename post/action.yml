name: depsound post
description: Post a depsound report (sticky comment + neutral check) from a trusted PR job.
author: Rod Vagg
branding:
  icon: message-square
  color: purple

inputs:
  github-token:
    description: Token used to download the report artifact and post the comment + check.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Download report
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: depsound-report
        path: report
        run-id: ${{ github.run_id }}
        github-token: ${{ inputs.github-token }}

    - name: Upsert comment and set check
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        DEPSOUND_POST_ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        retries: 3
        script: |
          const { postReport } = require(`${process.env.DEPSOUND_POST_ACTION_PATH}/post.cjs`);
          await postReport({ fs: require('fs'), github, context, core });
